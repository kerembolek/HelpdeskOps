# HelpdeskOps with SQL Server on one machine. Copy .env.example to .env, fill it in, then run: docker compose up -d
# The full guide, including HTTPS and backups, is in docs/INSTALL_TR.md.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Express is free up to 10 GB per database, plenty for a 20-200 person company
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    image: helpdeskops:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=HelpdeskOps;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      # Only behind a reverse proxy that terminates HTTPS: then cookies, redirects, and audit IP addresses use the real
      # client. Left off otherwise, because anyone reaching the app directly could fake their IP address in the audit log.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${BEHIND_PROXY:-false}
      TZ: Europe/Istanbul
      # Keep the SQL text of every query out of the logs
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      InitialAdminEmail: ${INITIAL_ADMIN_EMAIL:-}
      Kvkk__ControllerName: ${KVKK_CONTROLLER_NAME:?Set KVKK_CONTROLLER_NAME in .env}
      Kvkk__ControllerAddress: ${KVKK_CONTROLLER_ADDRESS:-}
      Kvkk__ContactEmail: ${KVKK_CONTACT_EMAIL:-}
      Inventory__ApiKey: ${INVENTORY_API_KEY:-}
      Directory__Provider: ${DIRECTORY_PROVIDER:-None}
      Directory__Entra__TenantId: ${ENTRA_TENANT_ID:-}
      Directory__Entra__ClientId: ${ENTRA_CLIENT_ID:-}
      Directory__Entra__ClientSecret: ${ENTRA_CLIENT_SECRET:-}
      Directory__Ldap__Host: ${LDAP_HOST:-}
      Directory__Ldap__Port: ${LDAP_PORT:-636}
      Directory__Ldap__BindDn: ${LDAP_BIND_DN:-}
      Directory__Ldap__BindPassword: ${LDAP_BIND_PASSWORD:-}
      Directory__Ldap__BaseDn: ${LDAP_BASE_DN:-}
      Sla__WorkdayStart: ${SLA_WORKDAY_START:-09:00:00}
      Sla__WorkdayEnd: ${SLA_WORKDAY_END:-18:00:00}
      Email__Mode: ${EMAIL_MODE:-None}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UserName: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM:-helpdesk@helpdeskops.local}
      Email__PublicUrl: ${APP_PUBLIC_URL:-}
      Email__Inbound__Host: ${IMAP_HOST:-}
      Email__Inbound__Port: ${IMAP_PORT:-993}
      Email__Inbound__UserName: ${IMAP_USER:-}
      Email__Inbound__Password: ${IMAP_PASSWORD:-}
      Teams__WebhookUrl: ${TEAMS_WEBHOOK_URL:-}
    volumes:
      - app-data:/app/App_Data

volumes:
  db-data:
  app-data:
