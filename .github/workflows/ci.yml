# Builds the solution and runs the unit tests on every push to main and every pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HelpdeskOps.slnx

      - name: Build
        run: dotnet build HelpdeskOps.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HelpdeskOps.slnx --configuration Release --no-build --verbosity normal
